<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="t d">
<title id="t">Configured default memory budgets of HTND 2.18.1 versus an 8 GB host</title>
<desc id="d">Stacked bar chart. Configured default budgets: Go soft limit 8.0 GB, Pebble cache 2 GiB (about 2.15 GB), serialized off-heap caches 256 plus 128 MiB (about 0.40 GB), total about 10.55 GB, against a horizontal line at 8 GB host RAM. These are configured budgets, not measured simultaneous occupancy.</desc>
<rect width="700" height="420" fill="#ffffff"/>
<text x="350.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Configured default memory budgets vs an 8 GB host (HTN-17)</text>
<line x1="70.0" y1="50.0" x2="70.0" y2="330.0" stroke="#000000" stroke-width="1"/>
<line x1="70.0" y1="330.0" x2="400.0" y2="330.0" stroke="#000000" stroke-width="1"/>
<line x1="70.0" y1="330.0" x2="400.0" y2="330.0" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">0</text>
<line x1="70.0" y1="283.3" x2="400.0" y2="283.3" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="287.3333333333333" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">2</text>
<line x1="70.0" y1="236.7" x2="400.0" y2="236.7" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="240.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">4</text>
<line x1="70.0" y1="190.0" x2="400.0" y2="190.0" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">6</text>
<line x1="70.0" y1="143.3" x2="400.0" y2="143.3" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="147.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">8</text>
<line x1="70.0" y1="96.7" x2="400.0" y2="96.7" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="100.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">10</text>
<line x1="70.0" y1="50.0" x2="400.0" y2="50.0" stroke="#dddddd" stroke-width="1"/>
<text x="62" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#000000">12</text>
<text x="18" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#000000" transform="rotate(-90 18 190.0)">GB (decimal)</text>
<rect x="150.0" y="143.3" width="160.0" height="186.7" fill="#0072B2" stroke="none"/>
<text x="230.0" y="240.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">8.00 GB</text>
<rect x="150.0" y="93.2" width="160.0" height="50.2" fill="#E69F00" stroke="none"/>
<text x="230.0" y="122.25" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#000000">2.15 GB</text>
<rect x="150.0" y="83.8" width="160.0" height="9.3" fill="#009E73" stroke="none"/>
<text x="316" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#000000">0.40 GB</text>
<text x="230.0" y="75.83333333333334" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#000000">total 10.55 GB</text>
<line x1="70.0" y1="143.3" x2="400.0" y2="143.3" stroke="#D55E00" stroke-width="2" stroke-dasharray="6,4"/>
<text x="318" y="137.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#D55E00">8 GB host RAM</text>
<text x="230.0" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#000000">default configuration</text>
<rect x="430.0" y="90.0" width="14.0" height="14.0" fill="#0072B2" stroke="none"/>
<text x="452" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000000">Go soft limit (GOMEMLIMIT default)</text>
<rect x="430.0" y="134.0" width="14.0" height="14.0" fill="#E69F00" stroke="none"/>
<text x="452" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000000">Pebble block cache</text>
<text x="452" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">2 GiB (cgo, outside the Go limit)</text>
<rect x="430.0" y="178.0" width="14.0" height="14.0" fill="#009E73" stroke="none"/>
<text x="452" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000000">Serialized off-heap caches</text>
<text x="452" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#444444">256 + 128 MiB</text>
<text x="350.0" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">Configured budgets, not measured simultaneous occupancy: the Go runtime may stay well below its soft limit</text>
<text x="350.0" y="389" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">and the caches fill over time. Measured occupancy is pending (reports/memory-test.md). Source: findings/HTN-17.md.</text>
</svg>
