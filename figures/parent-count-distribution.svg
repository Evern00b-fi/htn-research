<title id="t">Dynamic K = number of parents: distribution over 165,427 mainnet blocks (R1)</title>
<desc id="d">Bar chart. Share of mainnet blocks by number of parents, which equals the GHOSTDAG K applied to the block: 1 parent 23.7 %, 2 parents 35.1 %, 3 parents 25.5 %, 4 parents 11.2 %, 5 or more parents 4.5 %. 165,427 blocks over about 9 hours, one node's view.</desc>
