<text x="350.0" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">coloured with K &lt;= 3, which covers roughly 82 ms of delay at delta = 0.01. Source: reports/red-blocks.md (R1).</text>
